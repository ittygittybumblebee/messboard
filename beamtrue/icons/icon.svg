<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2b"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b5e"/>
      <stop offset="0.55" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#26304a" stroke-width="6"/>
  <!-- beam: in from the left, folded down by the mirror -->
  <line x1="70" y1="232" x2="330" y2="232" stroke="#ff3b30" stroke-width="22" stroke-linecap="round"/>
  <line x1="330" y1="232" x2="330" y2="400" stroke="#ff3b30" stroke-width="22" stroke-linecap="round"/>
  <!-- 45° mirror -->
  <rect x="272" y="216" width="116" height="30" rx="8" transform="rotate(45 330 232)" fill="#93a0bd"/>
  <rect x="272" y="216" width="116" height="30" rx="8" transform="rotate(45 330 232)" fill="none" stroke="#c7d2e8" stroke-width="5"/>
  <!-- burn dot with glow -->
  <circle cx="330" cy="418" r="74" fill="url(#glow)" opacity="0.85"/>
  <circle cx="330" cy="418" r="26" fill="#fff"/>
  <!-- crosshair target around the dot -->
  <circle cx="330" cy="418" r="52" fill="none" stroke="#e8ecf6" stroke-width="7" stroke-dasharray="20 14" opacity="0.9"/>
</svg>

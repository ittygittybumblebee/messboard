<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0a0a0c"/>
  <rect x="26" y="26" width="460" height="460" rx="76" fill="none" stroke="#3a3835" stroke-width="4"/>
  <!-- beam: in from the left, folded down by the mirror -->
  <line x1="76" y1="226" x2="330" y2="226" stroke="#ff4d00" stroke-width="20"/>
  <line x1="330" y1="226" x2="330" y2="384" stroke="#ff4d00" stroke-width="20"/>
  <!-- 45-degree mirror -->
  <line x1="270" y1="166" x2="390" y2="286" stroke="#e8e6e3" stroke-width="16"/>
  <!-- burn dot with reticle -->
  <circle cx="330" cy="414" r="26" fill="#ff4d00"/>
  <circle cx="330" cy="414" r="56" fill="none" stroke="#e8e6e3" stroke-width="6" stroke-dasharray="26 16"/>
</svg>
